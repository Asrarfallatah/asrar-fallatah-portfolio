<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const pathSegmentsToKeep = 1;
      const locationRef = window.location;
      const redirectPath = locationRef.pathname
        .split('/')
        .slice(0, 1 + pathSegmentsToKeep)
        .join('/');
      const route = locationRef.pathname
        .slice(1)
        .split('/')
        .slice(pathSegmentsToKeep)
        .join('/')
        .replace(/&/g, '~and~');
      locationRef.replace(
        `${locationRef.protocol}//${locationRef.hostname}${locationRef.port ? `:${locationRef.port}` : ''}${redirectPath}/?/${route}${locationRef.search ? `&${locationRef.search.slice(1).replace(/&/g, '~and~')}` : ''}${locationRef.hash}`,
      );
    </script>
  </head>
  <body>Redirecting...</body>
</html>
